<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VR Object Tracker</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      font-family: sans-serif;
    }

    /* Main Viewport Container */
    #app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Eye split-screen wrappers */
    .eye-view {
      position: relative;
      flex: 1;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* Secondary eye is hidden until VR mode is enabled */
    #right-eye {
      display: none;
      border-left: 2px solid #222;
    }

    video {
      display: none; /* Video source is kept hidden in memory */
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Status text overlay */
    #status {
      position: absolute;
      top: 12px;
      left: 12px;
      color: #00FF88;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      z-index: 10;
      pointer-events: none;
    }

    /* Tiny VR toggle button at bottom right */
    #vr-btn {
      position: absolute;
      bottom: 16px;
      right: 16px;
      z-index: 20;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #00FF88;
      color: #00FF88;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    #vr-btn svg {
      width: 24px;
      height: 24px;
      fill: #00FF88;
    }
  </style>
</head>
<body>

  <div id="status">Initializing Camera...</div>

  <!-- Main Viewport -->
  <div id="app-container">
    <!-- Left Eye / Standard View -->
    <div class="eye-view" id="left-eye">
      <canvas id="canvas-left"></canvas>
    </div>

    <!-- Right Eye (VR Mode) -->
    <div class="eye-view" id="right-eye">
      <canvas id="canvas-right"></canvas>
    </div>
  </div>

  <!-- Hidden Video Feed -->
  <video id="webcam" autoplay playsinline muted></video>

  <!-- Tiny VR Button -->
  <button id="vr-btn" title="Toggle VR Mode">
    <svg viewBox="0 0 24 24">
      <path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h5l2 2h4l2-2h5c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-12 7c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm9 0c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3z"/>
    </svg>
  </button>

  <script>
    const video = document.getElementById('webcam');
    const canvasLeft = document.getElementById('canvas-left');
    const ctxLeft = canvasLeft.getContext('2d');
    const canvasRight = document.getElementById('canvas-right');
    const ctxRight = canvasRight.getContext('2d');
    
    const statusText = document.getElementById('status');
    const vrBtn = document.getElementById('vr-btn');
    const rightEye = document.getElementById('right-eye');

    let model;
    let isVrMode = false;

    // Track objects across frames to store motion history
    let trackedObjects = [];
    let nextTrackId = 1;

    // Initialize Camera (Defaults to Rear View)
    async function setupCamera() {
      const constraints = {
        video: {
          facingMode: { exact: "environment" },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      };

      try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
      } catch (err) {
        console.warn("Exact rear camera unavailable, using default environment mode.");
        const fallbackStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        video.srcObject = fallbackStream;
      }

      return new Promise((resolve) => {
        video.onloadedmetadata = () => resolve(video);
      });
    }

    // Match detected bounding boxes to previous frames to assign stable IDs
    function updateTrackingHistory(predictions) {
      const currentDetections = predictions.slice(0, 4);
      const updatedTracked = [];

      currentDetections.forEach(pred => {
        const [x, y, w, h] = pred.bbox;
        const centerX = x + w / 2;
        const centerY = y + h / 2;

        // Find nearest object from previous frame
        let closest = null;
        let minDistance = 100; // max pixel distance threshold to associate movement

        trackedObjects.forEach(obj => {
          const dist = Math.hypot(obj.centerX - centerX, obj.centerY - centerY);
          if (dist < minDistance && obj.label === pred.class) {
            minDistance = dist;
            closest = obj;
          }
        });

        let history = [];
        let id = nextTrackId++;

        if (closest) {
          id = closest.id;
          history = closest.history;
        }

        // Save center position to motion trail
        history.push({ x: centerX, y: centerY });
        if (history.length > 15) history.shift(); // Limit path line length

        updatedTracked.push({
          id: id,
          label: pred.class,
          score: pred.score,
          bbox: pred.bbox,
          centerX: centerX,
          centerY: centerY,
          history: history
        });
      });

      trackedObjects = updatedTracked;
    }

    // Draw video feed and tracking visualizations on a canvas context
    function renderFrame(ctx, width, height) {
      ctx.clearRect(0, 0, width, height);

      // Draw mirrored/fitted camera frame
      ctx.drawImage(video, 0, 0, width, height);

      const scaleX = width / video.videoWidth;
      const scaleY = height / video.videoHeight;

      trackedObjects.forEach(obj => {
        const [x, y, w, h] = obj.bbox;
        
        const scaledX = x * scaleX;
        const scaledY = y * scaleY;
        const scaledW = w * scaleX;
        const scaledH = h * scaleY;

        // 1. Draw Motion Trail (Tracking Line)
        if (obj.history.length > 1) {
          ctx.beginPath();
          ctx.strokeStyle = 'rgba(0, 255, 136, 0.6)';
          ctx.lineWidth = 3;
          obj.history.forEach((pt, i) => {
            const hX = pt.x * scaleX;
            const hY = pt.y * scaleY;
            if (i === 0) ctx.moveTo(hX, hY);
            else ctx.lineTo(hX, hY);
          });
          ctx.stroke();
        }

        // 2. Bounding Box
        ctx.strokeStyle = '#00FF88';
        ctx.lineWidth = 3;
        ctx.strokeRect(scaledX, scaledY, scaledW, scaledH);

        // 3. Center Target Dot
        const cx = obj.centerX * scaleX;
        const cy = obj.centerY * scaleY;
        ctx.fillStyle = '#00FF88';
        ctx.beginPath();
        ctx.arc(cx, cy, 5, 0, 2 * Math.PI);
        ctx.fill();

        // 4. Label Header
        const labelText = `#${obj.id} ${obj.label} (${Math.round(obj.score * 100)}%)`;
        ctx.font = 'bold 14px sans-serif';
        const textWidth = ctx.measureText(labelText).width;

        ctx.fillStyle = '#00FF88';
        ctx.fillRect(scaledX, scaledY > 25 ? scaledY - 25 : scaledY, textWidth + 12, 22);

        ctx.fillStyle = '#000000';
        ctx.fillText(labelText, scaledX + 6, scaledY > 25 ? scaledY - 8 : scaledY + 16);
      });
    }

    // Main Detection Loop
    async function processFrame() {
      // Sync canvas dimensions
      if (canvasLeft.width !== video.videoWidth) {
        canvasLeft.width = video.videoWidth;
        canvasLeft.height = video.videoHeight;
        canvasRight.width = video.videoWidth;
        canvasRight.height = video.videoHeight;
      }

      // Run detection
      const predictions = await model.detect(video);
      updateTrackingHistory(predictions);

      // Render Left Canvas
      renderFrame(ctxLeft, canvasLeft.width, canvasLeft.height);

      // Render Right Canvas (VR Mode)
      if (isVrMode) {
        renderFrame(ctxRight, canvasRight.width, canvasRight.height);
      }

      requestAnimationFrame(processFrame);
    }

    // Toggle VR Split-Screen & Fullscreen Landscape Rotation
    async function toggleVR() {
      isVrMode = !isVrMode;

      if (isVrMode) {
        rightEye.style.display = 'block';

        // Request Fullscreen
        try {
          if (document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen();
          }
          // Request Landscape Lock for VR Headsets
          if (screen.orientation && screen.orientation.lock) {
            await screen.orientation.lock('landscape').catch(() => {});
          }
        } catch (e) {
          console.log("Fullscreen/Rotation Lock error:", e);
        }
      } else {
        rightEye.style.display = 'none';

        if (document.exitFullscreen && document.fullscreenElement) {
          document.exitFullscreen().catch(() => {});
        }
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
        }
      }
    }

    vrBtn.addEventListener('click', toggleVR);

    // Entry Point
    async function init() {
      try {
        await setupCamera();
        statusText.innerText = "Loading AI model...";
        model = await cocoSsd.load();
        statusText.innerText = "Tracking active (Max 4 objects)";
        setTimeout(() => { statusText.style.opacity = '0.5'; }, 3000);
        processFrame();
      } catch (err) {
        statusText.innerText = "Error: " + err.message;
      }
    }

    init();
  </script>
</body>
</html>
