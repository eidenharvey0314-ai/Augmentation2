<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VR Object Tracker</title>
  
  <link rel="stylesheet" href="styles.css">

  <!-- TensorFlow.js and Coco-SSD Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd" defer></script>
  <script src="app.js" defer></script>
</head>
<body>

  <div id="status">Initializing Camera...</div>

  <!-- Main Viewport -->
  <div id="app-container">
    <!-- Left Eye / Standard View -->
    <div class="eye-view" id="left-eye">
      <canvas id="canvas-left"></canvas>
    </div>

    <!-- Right Eye (VR Mode) -->
    <div class="eye-view" id="right-eye">
      <canvas id="canvas-right"></canvas>
    </div>
  </div>

  <!-- Hidden Video Feed -->
  <video id="webcam" autoplay playsinline muted></video>

  <!-- VR Toggle Button -->
  <button id="vr-btn" title="Toggle VR Mode">
    <svg viewBox="0 0 24 24">
      <path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h5l2 2h4l2-2h5c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-12 7c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm9 0c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3z"/>
    </svg>
  </button>

</body>
</html>
