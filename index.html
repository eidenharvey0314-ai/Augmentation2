<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VR Object Tracker Pro</title>
  
  <!-- TensorFlow.js GPU & Coco-SSD MobileNetV2 -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
    }

    #app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      background: #000000;
    }

    .eye-view {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
    }

    #right-eye {
      display: none;
      border-left: 1px solid rgba(255, 255, 255, 0.15);
    }

    video {
      display: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      touch-action: none;
    }

    #hud {
      position: absolute;
      top: calc(12px + env(safe-area-inset-top));
      left: calc(12px + env(safe-area-inset-left));
      color: #00FF88;
      background: rgba(0, 0, 0, 0.65);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      z-index: 10;
      pointer-events: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 255, 136, 0.2);
    }

    #vr-btn {
      position: absolute;
      bottom: calc(16px + env(safe-area-inset-bottom));
      right: calc(16px + env(safe-area-inset-right));
      z-index: 20;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.75);
      border: 1.5px solid #00FF88;
      color: #00FF88;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
      -webkit-tap-highlight-color: transparent;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    #vr-btn:active {
      transform: scale(0.92);
    }

    #vr-btn svg {
      width: 26px;
      height: 26px;
      fill: #00FF88;
    }
  </style>
</head>
<body>

  <div id="hud">Initializing Engine...</div>

  <div id="app-container">
    <div class="eye-view" id="left-eye">
      <canvas id="canvas-left"></canvas>
    </div>
    <div class="eye-view" id="right-eye">
      <canvas id="canvas-right"></canvas>
    </div>
  </div>

  <video id="webcam" autoplay playsinline muted></video>

  <button id="vr-btn" title="Toggle VR Split-Screen">
    <svg viewBox="0 0 24 24">
      <path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h5l2 2h4l2-2h5c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-12 7c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm9 0c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3z"/>
    </svg>
  </button>

  <script>
    const video = document.getElementById('webcam');
    const canvasLeft = document.getElementById('canvas-left');
    const ctxLeft = canvasLeft.getContext('2d');
    const canvasRight = document.getElementById('canvas-right');
    const ctxRight = canvasRight.getContext('2d');

    const hud = document.getElementById('hud');
    const vrBtn = document.getElementById('vr-btn');
    const rightEye = document.getElementById('right-eye');

    let model;
    let isVrMode = false;
    let isDetecting = false;

    let trackedObjects = [];
    let nextTrackId = 1;
    const SMOOTHING_FACTOR = 0.35; // Smoothing for bbox movement

    // Setup Camera Stream with Native Resolution Constraints
    async function setupCamera() {
      const constraints = {
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1280, max: 1920 },
          height: { ideal: 720, max: 1080 },
          frameRate: { ideal: 60, max: 60 }
        },
        audio: false
      };

      try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
      } catch (err) {
        console.warn("Exact constraints failed, falling back:", err);
        const fallbackStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        video.srcObject = fallbackStream;
      }

      return new Promise((resolve) => {
        video.onloadedmetadata = () => resolve(video);
      });
    }

    // Advanced Distance & Spatial Overlap Tracking Algorithm
    function updateTrackingHistory(predictions) {
      // Filter by confidence threshold and limit to top 4 targets
      const currentDetections = predictions
        .filter(p => p.score > 0.40)
        .slice(0, 4);

      const updatedTracked = [];

      currentDetections.forEach(pred => {
        const [x, y, w, h] = pred.bbox;
        const centerX = x + w / 2;
        const centerY = y + h / 2;

        let closest = null;
        let minDistance = 120; // Search radius for matching frames

        trackedObjects.forEach(obj => {
          const dist = Math.hypot(obj.centerX - centerX, obj.centerY - centerY);
          if (dist < minDistance && obj.label === pred.class) {
            minDistance = dist;
            closest = obj;
          }
        });

        let history = [];
        let id = nextTrackId++;
        let smoothBbox = [x, y, w, h];

        if (closest) {
          id = closest.id;
          history = closest.history;

          // Exponential Moving Average (EMA) box smoothing to eliminate jitter
          smoothBbox = [
            closest.bbox[0] + (x - closest.bbox[0]) * SMOOTHING_FACTOR,
            closest.bbox[1] + (y - closest.bbox[1]) * SMOOTHING_FACTOR,
            closest.bbox[2] + (w - closest.bbox[2]) * SMOOTHING_FACTOR,
            closest.bbox[3] + (h - closest.bbox[3]) * SMOOTHING_FACTOR
          ];
        }

        const smoothCenterX = smoothBbox[0] + smoothBbox[2] / 2;
        const smoothCenterY = smoothBbox[1] + smoothBbox[3] / 2;

        history.push({ x: smoothCenterX, y: smoothCenterY });
        if (history.length > 15) history.shift();

        updatedTracked.push({
          id: id,
          label: pred.class,
          score: pred.score,
          bbox: smoothBbox,
          centerX: smoothCenterX,
          centerY: smoothCenterY,
          history: history
        });
      });

      trackedObjects = updatedTracked;
    }

    // Canvas Render Engine with DPR Scale and Object-Fit Cover Logic
    function renderFrame(ctx, canvas) {
      const parent = canvas.parentElement;
      const dpr = window.devicePixelRatio || 1;
      const displayW = parent.clientWidth;
      const displayH = parent.clientHeight;

      // Handle high-DPI retina rendering
      if (canvas.width !== displayW * dpr || canvas.height !== displayH * dpr) {
        canvas.width = displayW * dpr;
        canvas.height = displayH * dpr;
      }

      ctx.save();
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, displayW, displayH);

      const vW = video.videoWidth || 640;
      const vH = video.videoHeight || 480;

      // Full Bleed Cover Ratio
      const scale = Math.max(displayW / vW, displayH / vH);
      const renderW = vW * scale;
      const renderH = vH * scale;
      const offsetX = (displayW - renderW) / 2;
      const offsetY = (displayH - renderH) / 2;

      ctx.drawImage(video, offsetX, offsetY, renderW, renderH);

      const scaleX = renderW / vW;
      const scaleY = renderH / vH;

      // Render Trackers
      trackedObjects.forEach(obj => {
        const [x, y, w, h] = obj.bbox;

        const scaledX = (x * scaleX) + offsetX;
        const scaledY = (y * scaleY) + offsetY;
        const scaledW = w * scaleX;
        const scaledH = h * scaleY;

        // 1. Motion Vector Line
        if (obj.history.length > 1) {
          ctx.beginPath();
          ctx.strokeStyle = 'rgba(0, 255, 136, 0.7)';
          ctx.lineWidth = 2.5;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          obj.history.forEach((pt, i) => {
            const hX = (pt.x * scaleX) + offsetX;
            const hY = (pt.y * scaleY) + offsetY;
            if (i === 0) ctx.moveTo(hX, hY);
            else ctx.lineTo(hX, hY);
          });
          ctx.stroke();
        }

        // 2. High-Tech Corner Bounding Reticle
        const lineLen = Math.min(scaledW, scaledH) * 0.25;
        ctx.strokeStyle = '#00FF88';
        ctx.lineWidth = 3;

        // Top-Left
        ctx.beginPath();
        ctx.moveTo(scaledX, scaledY + lineLen);
        ctx.lineTo(scaledX, scaledY);
        ctx.lineTo(scaledX + lineLen, scaledY);
        ctx.stroke();

        // Top-Right
        ctx.beginPath();
        ctx.moveTo(scaledX + scaledW - lineLen, scaledY);
        ctx.lineTo(scaledX + scaledW, scaledY);
        ctx.lineTo(scaledX + scaledW, scaledY + lineLen);
        ctx.stroke();

        // Bottom-Left
        ctx.beginPath();
        ctx.moveTo(scaledX, scaledY + scaledH - lineLen);
        ctx.lineTo(scaledX, scaledY + scaledH);
        ctx.lineTo(scaledX + lineLen, scaledY + scaledH);
        ctx.stroke();

        // Bottom-Right
        ctx.beginPath();
        ctx.moveTo(scaledX + scaledW - lineLen, scaledY + scaledH);
        ctx.lineTo(scaledX + scaledW, scaledY + scaledH);
        ctx.lineTo(scaledX + scaledW, scaledY + scaledH - lineLen);
        ctx.stroke();

        // 3. Target Center Point
        const cx = (obj.centerX * scaleX) + offsetX;
        const cy = (obj.centerY * scaleY) + offsetY;
        ctx.fillStyle = '#00FF88';
        ctx.beginPath();
        ctx.arc(cx, cy, 4, 0, 2 * Math.PI);
        ctx.fill();

        // 4. Label Badge
        const labelText = `#${obj.id} ${obj.label.toUpperCase()} [${Math.round(obj.score * 100)}%]`;
        ctx.font = '600 11px -apple-system, sans-serif';
        const textMetrics = ctx.measureText(labelText);
        const badgeW = textMetrics.width + 12;
        const badgeH = 20;
        const badgeY = scaledY > badgeH + 6 ? scaledY - badgeH - 4 : scaledY + 4;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.beginPath();
        ctx.roundRect(scaledX, badgeY, badgeW, badgeH, 4);
        ctx.fill();
        ctx.strokeStyle = '#00FF88';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.fillStyle = '#00FF88';
        ctx.fillText(labelText, scaledX + 6, badgeY + 14);
      });

      ctx.restore();
    }

    // Async Frame Processing Loop
    async function processFrame() {
      if (!isDetecting && video.readyState === 4) {
        isDetecting = true;
        const predictions = await model.detect(video);
        updateTrackingHistory(predictions);
        isDetecting = false;
      }

      renderFrame(ctxLeft, canvasLeft);

      if (isVrMode) {
        renderFrame(ctxRight, canvasRight);
      }

      requestAnimationFrame(processFrame);
    }

    // VR Toggle and Orientation Management
    async function toggleVR() {
      isVrMode = !isVrMode;

      if (isVrMode) {
        rightEye.style.display = 'block';

        try {
          if (document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen();
          }
          if (screen.orientation && screen.orientation.lock) {
            await screen.orientation.lock('landscape').catch(() => {});
          }
        } catch (e) {
          console.log("Orientation lock notice:", e);
        }
      } else {
        rightEye.style.display = 'none';

        if (document.exitFullscreen && document.fullscreenElement) {
          document.exitFullscreen().catch(() => {});
        }
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
        }
      }
    }

    vrBtn.addEventListener('click', toggleVR);

    // Initialization Sequence
    async function init() {
      try {
        await tf.setBackend('webgl');
        await tf.ready();
        
        await setupCamera();
        
        hud.innerText = "Loading MobileNetV2 Architecture...";
        
        // Load higher-accuracy MobileNetV2 base model
        model = await cocoSsd.load({ base: 'mobilenet_v2' });
        
        hud.innerText = "Tracking Active (2-4 Targets)";
        setTimeout(() => { hud.style.opacity = '0.4'; }, 3000);
        
        processFrame();
      } catch (err) {
        hud.innerText = "Initialization Error: " + err.message;
      }
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
